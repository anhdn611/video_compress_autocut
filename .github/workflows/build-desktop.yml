name: Build Desktop Applications (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build notarized macOS disk image
    # macos-14 is Apple Silicon. Compile the Vision helper on the runner rather
    # than shipping the ARM binary committed from a developer machine.
    runs-on: macos-14
    env:
      APP_NAME: VideoCompressAutocut
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          brew install create-dmg

      - name: Compile native Vision helper
        run: |
          swiftc -O -framework AVFoundation -framework CoreImage -framework Vision \
            cinematic_blur.swift -o cinematic_blur
          chmod +x cinematic_blur
          file cinematic_blur

      - name: Create macOS icon
        run: python convert_icon.py

      - name: Build macOS app bundle
        run: |
          pyinstaller --windowed --noconfirm --clean \
            --add-data "static:static" \
            --add-data "cinematic_blur:." \
            --icon="icon.icns" \
            --name="$APP_NAME" \
            app.py

      - name: Import Developer ID certificate
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign and validate app bundle
        run: |
          APP_PATH="dist/$APP_NAME.app"
          if [ -n "$CODESIGN_IDENTITY" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$APP_PATH"
          else
            # Fine for a manually-downloaded test artifact, never for a release.
            codesign --force --deep --sign - "$APP_PATH"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Require credentials for public releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -n "$CODESIGN_IDENTITY"
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Create .dmg Installer
        run: |
          mkdir -p dmg_out

          create-dmg \
            --overwrite \
            --volname "Video Compress Autocut" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 420 185 \
            "dmg_out/$APP_NAME.dmg" \
            "dist/$APP_NAME.app"

          if [ -n "$CODESIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "dmg_out/$APP_NAME.dmg"
          else
            codesign --force --sign - "dmg_out/$APP_NAME.dmg"
          fi
          codesign --verify --verbose=2 "dmg_out/$APP_NAME.dmg"

      - name: Notarize and staple release DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DMG_PATH="dmg_out/$APP_NAME.dmg"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_compress_autocut-macos-dmg
          path: dmg_out/VideoCompressAutocut.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: video_compress_autocut-macos-dmg
          path: release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_files/VideoCompressAutocut.dmg
