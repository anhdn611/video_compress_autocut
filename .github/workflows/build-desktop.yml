name: Build Desktop Applications (macOS Only)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ==========================================
  # MACOS BUILD JOB (ACTIVE)
  # ==========================================
  build-macos:
    name: Build macOS Disk Image (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & create-dmg
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow webview
          brew install ffmpeg create-dmg

      - name: Build macOS .app Bundle with Icon
        run: |
          ICON_PATH=""
          if [ -f favicon_io/android-chrome-512x512.png ]; then
            ICON_PATH="favicon_io/android-chrome-512x512.png"
          elif [ -f favicon_io/favicon.ico ]; then
            ICON_PATH="favicon_io/favicon.ico"
          fi

          if [ -n "$ICON_PATH" ]; then
            pyinstaller --windowed --noconfirm --icon="$ICON_PATH" --name="VideoCompressAutocut" app.py
          else
            pyinstaller --windowed --noconfirm --name="VideoCompressAutocut" app.py
          fi

      - name: Create .dmg Installer
        run: |
          mkdir -p dmg_out
          
          create-dmg \
            --volname "Video Compress Autocut" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 420 185 \
            "dmg_out/VideoCompressAutocut.dmg" \
            "dist/VideoCompressAutocut.app"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_compress_autocut-macos-dmg
          path: dmg_out/VideoCompressAutocut.dmg

  release:
    name: Publish GitHub Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: video_compress_autocut-macos-dmg
          path: release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_files/