name: Build Desktop Executables

on:
  push:
    tags:
      - 'v*' # Chạy tự động khi bạn push tag dạng v1.0.0, v1.1.0...
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: video_compress_autocut.exe
            asset_name: video_compress_autocut-windows.exe
          - os: macos-latest
            artifact_name: video_compress_autocut
            asset_name: video_compress_autocut-macos
          - os: ubuntu-latest
            artifact_name: video_compress_autocut
            asset_name: video_compress_autocut-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg

      - name: Build Executable with PyInstaller
        run: |
          # Đóng gói ứng dụng thành file đơn lẻ
          pyinstaller --onefile --name=video_compress_autocut main.py
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            video_compress_autocut-windows.exe/video_compress_autocut.exe
            video_compress_autocut-macos/video_compress_autocut
            video_compress_autocut-linux/video_compress_autocut
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
